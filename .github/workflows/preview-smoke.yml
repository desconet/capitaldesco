name: preview-smoke

on:
  push:
    branches:
      - "fix/fnde-calculation-hardening"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Vercel preview URL"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: ${{ github.event.inputs.target_url || 'https://capitaldesco-preview-51hgh89in-shivinhazens-projects.vercel.app/?_vercel_share=SbZhK8T7UqeQB8tYs6SlT8SZeikPAarM' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install Playwright for smoke only
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run real-browser preview smoke
        run: node tests/preview-smoke.mjs
