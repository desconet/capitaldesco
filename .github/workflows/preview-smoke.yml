name: preview-smoke

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Public or temporary Vercel preview URL (visible in Actions logs)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: ${{ inputs.target_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install Playwright for smoke only
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run real-browser preview smoke
        run: node tests/preview-smoke.mjs
